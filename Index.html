<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketGo - Inicio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/main1.css">
  <link rel="stylesheet" href="css/csscajero.css">
</head>
<body>

<header class="header">
  <a class="logo">
    <div class="logo-circle"></div>
    <div class="logo-text">
      <span class="brand">MarketGo</span>
    </div>
  </a>

  <nav class="nav-links">
    <a href="Index.html">Inicio <img src="img/casa.png" alt="" width="30" height="30"></a>
    <a href="carrito1.html">Carrito <img src="img/carri.png" alt="" width="30" height="30"></a>
    <a href="corazon.html">Favoritos <img src="img/cora.png" alt="" width="30" height="30"></a>
  </nav>

  <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
</header>

<div id="mobileMenu" class="mobile-menu">
  <div class="close-mobile" onclick="toggleMobile()">
    <button class="mobile-close" aria-label="Cerrar menú">✕</button>
  </div>
  <button id="btn-tema" class="btn-tema"><img src="img/moon.png" alt="" width="30" height="30"></button>

  <a href="Index.html">Inicio</a>
  <a href="carrito1.html">Carrito</a>
  <a href="corazon.html">Favoritos</a>

  <h3>Usuario</h3>
  <a href="./login/login.html">Inicio de Sesión</a>
 

  <h3>Categorías</h3>
  <div class="mobile-categorias">
    <button class="cat-btn">Todos</button>
    <button class="cat-btn">Lácteos</button>
    <button class="cat-btn">Verduras</button>
    <button class="cat-btn">Carnes</button>
    <button class="cat-btn">Limpieza del hogar</button>
    <button class="cat-btn">Higiene</button>
    <button class="cat-btn">Frutas y Verduras</button>
    <button class="cat-btn">Chucherías</button>
    <button class="cat-btn">Bebidas</button>
    <button class="cat-btn">Papelería</button>
    <button class="cat-btn">Carne y Embutidos</button>
    <button class="cat-btn">Pollo</button>
    <button class="cat-btn">Bebidas alcohólicas</button>
  </div>


  <div class="idioma-switch">
    <button onclick="changeLanguage('es')">ES</button>
    <button onclick="changeLanguage('en')">EN</button>
  </div>
</div>

<section class="hero" aria-label="Hero principal">
  <div class="hero-bg" aria-hidden="true">
    <div class="layer active" style="background-image:url('img/comes.jpg')"></div>
    <div class="layer" style="background-image:url('img/waitress.jpg')"></div>
    <div class="layer" style="background-image:url('img/viej.jpg')"></div>
    <div class="layer" style="background-image:url('img/wae.jpg')"></div>
  </div>

  <div class="hero-content">
    <h1>¡MarketGo te da la <span>Bienvenida</span>!</h1>
    <p>Encuentra ofertas, productos frescos y entrega rápida.</p>
  </div>
</section>

<section class="seccion-tienda">
  <main>
    <h2 class="titulo-principal" id="titulo-principal">Productos</h2>
    <div class="barra-busqueda">
      <input type="text" id="busqueda" placeholder="Buscar productos...">
      <button onclick="filtrarProductos()">Buscar</button>
    </div>
    <div id="contenedor-productos" class="contenedor-productos"></div>
  </main>
</section>

<footer class="footer">
  <p>© 2025 MarketGo - Todos los derechos reservados</p>
</footer>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="./js/main1.js"></script>
<script src="./js/menu.js"></script>
<script src="js/tema.js"></script>

<script>
function toggleMobile() {
  const menu = document.getElementById("mobileMenu");
  menu.classList.toggle("active");
}
document.querySelector(".menu-icon").addEventListener("click", toggleMobile);
</script>

<script>
  const translations = {
    es: {
      inicio: "Inicio",
      carrito: "Carrito",
      favoritos: "Favoritos",
      usuario: "Usuario",
      login: "Inicio de Sesión",
      cuenta: "Cuenta",
      categorias: "Categorías",
      productos: "Productos",
      buscar: "Buscar productos...",
      bienvenida: "¡MarketGo te da la ",
      bienvenidaSpan: "Bienvenida",
      descripcionHero: "Encuentra ofertas, productos frescos y entrega rápida.",
      footer: "© 2025 MarketGo - Todos los derechos reservados",
      categoriasList: [
        "Todos","Lácteos","Verduras","Carnes","Limpieza del hogar","Higiene",
        "Frutas y Verduras","Chucherías","Bebidas","Papelería","Carne y Embutidos",
        "Pollo","Bebidas alcohólicas"
      ]
    },
    en: {
      inicio: "Home",
      carrito: "Cart",
      favoritos: "Favorites",
      usuario: "User",
      login: "Login",
      cuenta: "Account",
      categorias: "Categories",
      productos: "Products",
      buscar: "Search products...",
      bienvenida: "MarketGo ",
      bienvenidaSpan: "welcomes you!",
      descripcionHero: "Find deals, fresh products, and fast delivery.",
      footer: "© 2025 MarketGo - All rights reserved",
      categoriasList: [
        "All","Dairy","Vegetables","Meat","Home Cleaning","Hygiene",
        "Fruits and Vegetables","Snacks","Drinks","Stationery","Meat and Sausages",
        "Chicken","Alcoholic Beverages"
      ]
    }
  };

  function changeLanguage(lang) {
    // Menú superior
    document.querySelectorAll(".nav-links a")[0].innerHTML = translations[lang].inicio + ' <img src="img/casa.png" width="30" height="30">';
    document.querySelectorAll(".nav-links a")[1].innerHTML = translations[lang].carrito + ' <img src="img/carri.png" width="30" height="30">';
    document.querySelectorAll(".nav-links a")[2].innerHTML = translations[lang].favoritos + ' <img src="img/cora.png" width="30" height="30">';

    // Menú móvil
    document.querySelector("#mobileMenu h3").textContent = translations[lang].usuario;
    document.querySelector("#mobileMenu a[href='./login/login.html']").textContent = translations[lang].login;
    document.querySelector("#mobileMenu a[href='MiCuenta.html']").textContent = translations[lang].cuenta;
    document.querySelector("#mobileMenu h3:nth-of-type(2)").textContent = translations[lang].categorias;

    // Categorías
    const catBtns = document.querySelectorAll(".mobile-categorias .cat-btn");
    translations[lang].categoriasList.forEach((txt, i) => {
      if (catBtns[i]) catBtns[i].textContent = txt;
    });

    // Productos
    document.getElementById("titulo-principal").textContent = translations[lang].productos;
    document.getElementById("busqueda").placeholder = translations[lang].buscar;

    // Hero
    const heroH1 = document.querySelector(".hero-content h1");
    const span = heroH1.querySelector("span");
    heroH1.firstChild.textContent = translations[lang].bienvenida; 
    span.textContent = translations[lang].bienvenidaSpan;

    document.querySelector(".hero-content p").textContent = translations[lang].descripcionHero;

    // Footer
    document.querySelector(".footer p").textContent = translations[lang].footer;

    // Guardar idioma en localStorage
    localStorage.setItem("language", lang);

    // Marcar botón activo
    document.querySelectorAll(".idioma-switch button").forEach(btn => {
      btn.classList.remove("active");
      if (btn.textContent.toLowerCase().includes(lang)) btn.classList.add("active");
    });
  }

  // Eventos de los botones
  document.querySelectorAll(".idioma-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      const lang = btn.textContent.toLowerCase().includes("es") ? "es" : "en";
      changeLanguage(lang);
    });
  });

  // Al cargar la página, aplicar idioma guardado
  window.onload = () => {
    const savedLang = localStorage.getItem("language") || "es";
    changeLanguage(savedLang);
  };
</script>
