<script>
  const hero = document.querySelector('.hero');
  const images = [
    'img/comes.jpg',
    'img/waitress.jpg',
    'img/viej.jpg',
    'img/wae.jpg',
   
  ];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % images.length;
    hero.style.backgroundImage = `url('${images[index]}')`;
  }, 3000);
</script>
<script>
(function(){
  const layers = Array.from(document.querySelectorAll('.hero-bg .layer'));
  if (!layers.length) return;

  let idx = 0;
  const INTERVAL = 4500; // tiempo entre cambios (ms)
  const FADE_MS = 1000;  // debe coincidir con transition de opacity en CSS

  function show(next) {
    layers.forEach((l, i) => l.classList.toggle('active', i === next));
  }

  // Inicia ciclo
  setInterval(() => {
    const next = (idx + 1) % layers.length;
    show(next);
    idx = next;
  }, INTERVAL);

  // Opcional: pausa la rotación si el usuario pasa el mouse (mejora UX)
  const hero = document.querySelector('.hero');
  let timer = null;
  if (hero) {
    hero.addEventListener('mouseenter', () => { clearInterval(timer); });
    hero.addEventListener('mouseleave', () => {
      // reinicia el intervalo con pequeño retraso
      timer = setInterval(() => {
        const next = (idx + 1) % layers.length;
        show(next);
        idx = next;
      }, INTERVAL);
    });
  }
})();
</script>
