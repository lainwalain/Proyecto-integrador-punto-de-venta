<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
 
  <header class="carrito-header">
    <div class="carrito-header__logo">Market.GO</div>
    <nav class="carrito-header__nav">
      <a href="Index.html">Volver a inicio <img src="img/casa.png" alt="" width="30" height="30"></a>
      <a href="corazon.html">favoritos <img src="img/cora.png" alt="" width="30" height="30"></a>
    </nav>

    <!-- Botón hamburguesa (visible en móvil con CSS) -->
    <button class="hamburger" aria-label="Abrir menú" aria-expanded="false" type="button">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </header>

  <!-- Backdrop -->
  <div class="mobile-backdrop" aria-hidden="true"></div>

  <!-- Menú móvil (panel lateral) -->
  <nav class="mobile-menu" aria-label="Menú móvil" role="navigation">
    <button class="mobile-menu__close" aria-label="Cerrar menú" type="button">&times;</button>

    <div class="mobile-menu__header">
     
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="Index.html"><img src="img/casa.png" alt="" width="18" height="18" aria-hidden="true"> Volver a inicio</a></li>
      <li><a class="mobile-menu__link" href="corazon.html"><img src="img/cora.png" alt="" width="18" height="18" aria-hidden="true"> Favoritos</a></li>
     
    </ul>
  </nav>

  <section class="carrito-hero">
    <div class="carrito-hero__contenido">
      <h2>Tu carrito</h2>
      <p>Te damos la bienvenida a tu carrito de compras</p>
    </div>
  </section>

  <div class="carrito-contenedor">
    <main class="carrito-main">

      <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-frown"></i></p>

      <section id="carrito-productos" class="carrito-productos disabled">
      </section>

      <section id="carrito-acciones" class="carrito-acciones disabled">
        <div class="carrito-total">
          <p>Total:</p>
          <p id="total">$0.00</p>
        </div>
        <div class="carrito-botones">
          <button id="carrito-acciones-vaciar" class="btn-vaciar">Vaciar carrito</button>
          <button id="carrito-acciones-comprar" class="btn-comprar">Comprar ahora</button>
        </div>
      </section>

      <p id="carrito-comprado" class="carrito-comprado disabled">Gracias por tu compra <i class="bi bi-emoji-laughing"></i></p>
    </main>
  </div>

  <footer class="carrito-footer">
    <p>© Market.GO — Todos los derechos reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/carrito.js"></script>

  <!-- Script del menú (insertado aquí para asegurar que se ejecute después del DOM) -->
  <script>
  (function () {
    function initMenu() {
      const btn = document.querySelector('.hamburger');
      const menu = document.querySelector('.mobile-menu');
      const closeBtn = document.querySelector('.mobile-menu__close');
      let backdrop = document.querySelector('.mobile-backdrop');

      if (!menu) return;

      // Crear backdrop si no existe (seguro)
      if (!backdrop) {
        backdrop = document.createElement('div');
        backdrop.className = 'mobile-backdrop';
        backdrop.setAttribute('aria-hidden', 'true');
        document.body.appendChild(backdrop);
      }

      function openMenu() {
        if (btn) btn.setAttribute('aria-expanded', 'true');
        menu.classList.add('active');
        backdrop.classList.add('visible');
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        const first = menu.querySelector('a,button');
        if (first) first.focus();
        if (btn) btn.classList.add('open');
      }

      function closeMenu() {
        if (btn) btn.setAttribute('aria-expanded', 'false');
        menu.classList.remove('active');
        backdrop.classList.remove('visible');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        if (btn) { btn.focus(); btn.classList.remove('open'); }
      }

      function toggleMenu() {
        menu.classList.contains('active') ? closeMenu() : openMenu();
      }

      // Exponer toggleMenu por compatibilidad si usas onclick inline
      window.toggleMenu = toggleMenu;

      // Eventos
      if (btn) {
        btn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMenu(); } });
      }

      if (closeBtn) closeBtn.addEventListener('click', closeMenu);
      backdrop.addEventListener('click', closeMenu);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('active')) closeMenu();
      });

      menu.addEventListener('click', (e) => {
        if (e.target.closest('a')) closeMenu();
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768 && menu.classList.contains('active')) closeMenu();
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMenu);
    else initMenu();
  })();
  </script>
</body>
</html>
